# Fixed eccentric e=0.4 midpoint-CN run with dt=10-equivalent solve density.
# The initial period is P0=2884.9321039, so 288 steps/orbit gives
# mean(dt)=P0/288=10.01712536 (0.171% coarser than fixed dt=10).

[grid]
N = 10000
L = 15000.0

[binary]
q = 1e-5
R = 35.71             # initial pericenter separation
e = 0.4
counter = false

[atom]
mu = 0.2
n = 2
l = 1
m = 1
M_c = 1.0

[simulation]
integrator = "midpoint_cn"
timestep_rule = "normalized_geometry"
startup_steps_per_period = 288
orbit_steps_per_period = 288
num_periods = 200
save_every = 100
l_max = 6
r_ex = 10000.0
ramp_periods = 2.0
epsilon = 0.0
evolve_orbit = false
absorption = false
epsilon_smear = 2.0

[parallel]
threads = 8

# Variable timesteps cannot use the legacy per-step mask consistently.
# This time-continuous CAP starts outside the extraction radius.
[cap]
L_factor = 0.85
W = 0.02
n = 2
