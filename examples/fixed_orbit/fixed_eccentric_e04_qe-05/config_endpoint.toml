# Fixed Kepler ellipse with p = R*(1+e) = 49.994 and initial pericenter R.

[grid]
N = 10000
L = 15000.0

[binary]
q = 1e-5
R = 35.71             # initial pericenter separation
e = 0.4
counter = false

[atom]
mu = 0.2
n = 2
l = 1
m = 1
M_c = 1.0

[simulation]
integrator = "legacy_endpoint"
dt = 50.0
num_periods = 150
save_every = 100
l_max = 6
r_ex = 10000.0
ramp_periods = 2.0
epsilon = 0.0
evolve_orbit = false # required for prescribed eccentric Stage I
absorption = false
epsilon_smear = 2.0

[parallel]
threads = 0

[mask]
L_factor = 0.85
W = 1
n = 6
