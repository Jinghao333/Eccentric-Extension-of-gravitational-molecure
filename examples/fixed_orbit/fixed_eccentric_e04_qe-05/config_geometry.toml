# Normalized geometry with 60 steps per period during startup and each full orbit.
# For the 288-step, q=1e-5 comparison use config_normalized_dt10.toml.

[grid]
N = 10000
L = 15000.0

[binary]
q = 1e-5
R = 35.71             # initial pericenter separation
e = 0.4
counter = false

[atom]
mu = 0.2
n = 2
l = 1
m = 1
M_c = 1.0

[simulation]
integrator = "midpoint_cn"
timestep_rule = "normalized_geometry"
startup_steps_per_period = 60
orbit_steps_per_period = 60
num_periods = 150
save_every = 100
l_max = 6
r_ex = 10000.0
ramp_periods = 2.0
epsilon = 0.0
evolve_orbit = false
absorption = false
epsilon_smear = 2.0

[parallel]
threads = 8

# Continuous-time equivalent of the historical dt=10 mask:
# exp[-W_mask*x^n] per dt=10 maps to H_CAP=-i*(W_mask/10)*x^n.
# Therefore W_CAP=0.1 and n=6 reproduce exp(-x^6) over 10 time units.
[cap]
L_factor = 0.85
W = 0.1
n = 6
