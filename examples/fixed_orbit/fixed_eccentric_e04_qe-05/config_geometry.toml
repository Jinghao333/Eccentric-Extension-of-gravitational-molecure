# Fixed Kepler ellipse with p = R*(1+e) = 49.994 and initial pericenter R.

[grid]
N = 10000
L = 15000.0

[binary]
q = 1e-5
R = 35.71             # initial pericenter separation
e = 0.4
counter = false

[atom]
mu = 0.2
n = 2
l = 1
m = 1
M_c = 1.0

[simulation]
integrator = "midpoint_cn"
timestep_rule = "orbital_geometry"
geometry_tolerance = 0.25
effective_azimuthal_order = 2
effective_radial_order = 3
ramp_weight_tolerance = 0.02
dt = 50.0
num_periods = 150
save_every = 100
l_max = 6
r_ex = 10000.0
ramp_periods = 2.0
epsilon = 0.0
evolve_orbit = false # required for prescribed eccentric Stage I
absorption = false
epsilon_smear = 2.0

[parallel]
threads = 0

# No outer absorber: select and validate a CAP for long ionization runs.
