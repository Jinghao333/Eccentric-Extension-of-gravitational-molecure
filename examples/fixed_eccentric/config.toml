# Small Stage-I prescribed eccentric-orbit example. "Fixed" means that the
# masses, eccentricity and semimajor axis do not backreact; R(t), theta(t) and
# both orbital velocities still change around the Kepler ellipse.

[grid]
N = 257
L = 128.0

[binary]
q = 0.1
R = 20.0             # initial pericenter separation
e = 0.3
counter = false

[atom]
mu = 0.2
n = 2
l = 1
m = 1
M_c = 0.01

[simulation]
dt = 2.0
num_periods = 0.25
save_every = 20
l_max = 3
r_ex = 96.0
ramp_periods = 0.1
ramp_secondary_potential = true
evolve_orbit = false  # required for e > 0 in Stage I
absorption = true
epsilon_smear = 2.0

[parallel]
threads = 0

[mask]
L_factor = 0.85
W = 1
n = 6
