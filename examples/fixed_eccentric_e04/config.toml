# Prescribed e=0.4 Kepler ellipse. "Fixed" means fixed masses and orbital
# elements; the black holes move and R, theta, R_dot and theta_dot all vary.

[grid]
N = 257
L = 128.0

[binary]
q = 0.1
R = 20.0             # initial pericenter separation
e = 0.4
counter = false      # set true for counter-rotation

[atom]
mu = 0.2
n = 2
l = 1
m = 1
M_c = 0.01

[simulation]
dt = 2.0
num_periods = 1.25   # measured in the Kepler period 2*pi/n
save_every = 20
l_max = 3
r_ex = 96.0
ramp_periods = 0.1
ramp_secondary_potential = true
evolve_orbit = false # eccentric inspiral is intentionally not implemented
absorption = true
epsilon_smear = 2.0

[parallel]
threads = 0          # use OMP_NUM_THREADS / all available runtime threads

[mask]
L_factor = 0.85
W = 1
n = 6
