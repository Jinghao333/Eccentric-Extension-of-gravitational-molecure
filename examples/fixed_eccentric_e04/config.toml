# Eccentric counterpart of examples/minimal/baseline.toml. All baseline
# scientific and numerical settings are retained. R=60 is now the initial
# pericenter, and e=0.4 prescribes a moving fixed-element Kepler ellipse.

[grid]
N = 10000
L = 15000.0

[binary]
q = 1e-5
R = 60.0             # initial pericenter separation
e = 0.4
counter = false

[atom]
mu = 0.2
n = 2
l = 1
m = 1
M_c = 1.0

[simulation]
dt = 100.0
num_periods = 150
save_every = 1460
l_max = 10
r_ex = 10000.0
ramp_periods = 2.0
epsilon = 0.0
evolve_orbit = false # required for prescribed eccentric Stage I
absorption = false
epsilon_smear = 2.0

[parallel]
threads = 0

[mask]
L_factor = 0.85
W = 1
n = 6
